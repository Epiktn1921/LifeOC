<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Life OS — календарь, задачи, цели и финансы в одном месте">
<meta name="theme-color" content="#13131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Life OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
.lgimg{width:56px;height:auto;display:block;flex:none}
.glogo .lgimg{width:72px}
#banner .lgimg{width:44px}
/* Layout: веб-приложение — чёрная боковая панель с логотипом, огромные узкие заголовки, бенто-сетка ярких карточек с кругами; на телефоне — плавающая нижняя панель */
:root{
  --bg:#f2f2ec;--surf:#ffffff;--surf2:#e8e8e1;--ink:#13131a;--mut:#6b6b73;--line:rgba(19,19,26,.12);--fill:rgba(19,19,26,.06);--fill2:rgba(19,19,26,.16);
  --link:#6c35ea;--acc:#c3f581;--onacc:#13131a;--danger:#e8460a;--pos:#00995a;
  --side:#13131a;--sideink:#fbfbfb;--sidemut:#8b8b93;--ink-fixed:#13131a;
  --c-red:#ff5003;--c-orange:#ff9f43;--c-yellow:#fff04c;--c-green:#00ac64;--c-teal:#c3f581;--c-blue:#1aaefc;--c-purple:#6c35ea;--c-brown:#c397ff;--c-gray:#b1b1b1;--c-pink:#f0c1e9;
  --o-red:#13131a;--o-orange:#13131a;--o-yellow:#13131a;--o-green:#13131a;--o-teal:#13131a;--o-blue:#13131a;--o-purple:#fbfbfb;--o-brown:#13131a;--o-gray:#13131a;--o-pink:#13131a;
  --fd:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hh:52px;--navh:72px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13131a;--surf:#1f1f26;--surf2:#2a2a32;--ink:#fbfbfb;--mut:#9a9aa3;--line:rgba(251,251,251,.09);--fill:rgba(251,251,251,.07);--fill2:rgba(251,251,251,.16);
  --link:#c3f581;--danger:#ff6a2b;--pos:#3fd18b;--side:#0b0b0f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13131a;--surf:#1f1f26;--surf2:#2a2a32;--ink:#fbfbfb;--mut:#9a9aa3;--line:rgba(251,251,251,.09);--fill:rgba(251,251,251,.07);--fill2:rgba(251,251,251,.16);
  --link:#c3f581;--danger:#ff6a2b;--pos:#3fd18b;--side:#0b0b0f;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--navh))}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--fb);-webkit-font-smoothing:antialiased;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:8px}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.wrap{padding-left:32px;padding-right:32px}}
.narrow{max-width:780px}
.mut{color:var(--mut)}
.late{color:var(--danger);font-weight:700}
/* top bar */
.nb{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
body.scrolled .nb,.nb.solid{border-bottom-color:var(--line)}
.nbr{display:flex;justify-content:space-between;align-items:center;min-height:66px;gap:10px}
.nbr .l{display:flex;align-items:center;gap:10px;min-width:0}
.nbr .r{display:flex;align-items:center;gap:8px;flex:none}
.ct{font:800 18px/1.1 var(--fd);letter-spacing:-.02em;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct.on,body.scrolled .ct{opacity:1}
@media(max-width:480px){.ct{display:none}}
.nbx{padding-bottom:12px}
.tb{display:inline-flex;align-items:center;gap:4px;background:var(--fill);color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:700;font-size:14px;white-space:nowrap}
.tb .i{width:18px;height:18px;stroke-width:2.4}
.tb.sm{padding:6px 12px;font-size:13px}
.tb:hover,.ib:hover{background:var(--fill2)}
.ib{width:42px;height:42px;border-radius:50%;background:var(--fill);color:var(--ink);display:grid;place-items:center;flex:none}
.ib .i{width:20px;height:20px}
.ib[data-a="new"]{background:var(--acc);color:var(--onacc)}
.av{width:40px;height:40px;border-radius:50%;background:var(--c-brown);color:#13131a;display:grid;place-items:center;font:800 19px/1 var(--fd);flex:none}
@media(min-width:900px){.av.mob{display:none}}
.lt{font:800 clamp(38px,5.4vw,72px)/.98 var(--fd);text-transform:uppercase;letter-spacing:-.045em;margin:12px 0 24px;text-wrap:balance;overflow-wrap:anywhere}
.lt .yr{font-size:.42em;color:var(--mut);margin-left:.3em;letter-spacing:-.02em}
.gh{font:800 12px/1.2 var(--fd);text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:30px 4px 10px}
.gf{font-size:13px;color:var(--mut);margin:9px 4px 0;line-height:1.4}
.gf.red{color:var(--danger)}
/* pills */
.seg{display:flex;gap:4px;background:var(--fill);border-radius:999px;padding:4px;max-width:640px}
.seg button{flex:1;font-size:13.5px;font-weight:700;padding:8px 10px;border-radius:999px;white-space:nowrap;min-width:0;text-align:center;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg .wk{display:none}
@media(min-width:640px){.seg .wk{display:block}}
/* lists */
.gs{background:var(--surf);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 18px;position:relative;width:100%;text-align:left;color:var(--ink)}
.row+.row::before,.row+.trw::before,.trw+.row::before,.trw+.trw::before{content:"";position:absolute;top:0;left:18px;right:18px;border-top:1px solid var(--line)}
.row .rl{flex:1;min-width:0}
.row .rv{color:var(--mut);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.row.tint{color:var(--link);font-weight:700}
.row.red{color:var(--danger);font-weight:700;justify-content:center}
.row.center{justify-content:center;color:var(--link);font-weight:700}
.chev{width:15px;height:15px;color:var(--mut);stroke-width:2.6}
.tt1{display:block;overflow-wrap:anywhere;font-weight:600}
.ss{display:block;font-size:13px;color:var(--mut);margin-top:2px;line-height:1.35;font-weight:500}
.sq{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#13131a;flex:none}
.sq .i{width:19px;height:19px}
.cdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.ri{flex:1;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:6px 0;min-width:0;outline:none;width:100%}
.ri::placeholder{color:var(--mut);font-weight:500}
textarea.ri{resize:vertical;min-height:70px;line-height:1.4;font-weight:500}
.pil{background:var(--fill);border:0;border-radius:12px;padding:8px 12px;font:inherit;font-weight:600;font-size:15px;color:var(--ink);min-width:0;max-width:62%}
select.pil{max-width:60%;text-overflow:ellipsis}
.pil.num{width:130px;text-align:right}
input.sw{-webkit-appearance:none;appearance:none;width:52px;height:32px;border-radius:16px;background:var(--fill2);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
input.sw::before{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s,background .2s}
input.sw:checked{background:var(--acc)}
input.sw:checked::before{transform:translateX(20px);background:#13131a}
.btn{display:block;width:100%;background:var(--acc);color:var(--onacc);border-radius:999px;font:700 16px/1 var(--fd);letter-spacing:-.01em;padding:18px 20px;text-align:center}
.btn:disabled{opacity:.5}
.empty{color:var(--mut);text-align:center;padding:28px 16px;font-size:15px}
/* month */
.mtr{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:6px}
.mtr .lt{margin-bottom:14px}
.arr{display:flex;gap:8px;padding-bottom:18px}
.wdh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font:700 11px var(--fd);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:8px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh));background:var(--bg);z-index:3}
.wdh span{padding-left:2px;text-align:center}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mc{background:var(--surf);border:2px solid transparent;border-radius:14px;min-height:62px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);min-width:0;font-variant-numeric:tabular-nums;transition:border-color .15s}
.mc:hover{border-color:var(--fill2)}
.mc.e{background:transparent;pointer-events:none}
.mc .dn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 16px/1 var(--fd)}
.mc.we .dn{color:var(--mut)}
.mc.t .dn{background:var(--acc);color:var(--onacc)}
.mc.s{border-color:var(--ink)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.mch{display:none;flex-direction:column;gap:3px;width:100%;min-width:0}
.mchip{font-size:11.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center;color:var(--ink);min-width:0}
.mchip i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--cc)}
.mchip.ad{background:var(--cc);color:var(--oc);border-radius:6px;padding:1px 6px;font-weight:700}
.mchip.dn2{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--mut);padding-left:2px;font-weight:600}
@media(min-width:900px){
  .mg{gap:6px}
  .mc{min-height:120px;align-items:stretch;padding:8px 8px 8px;border-radius:16px}
  .mc .dn{width:32px;height:32px;font-size:16px}
  .dots{display:none}.mch{display:flex}
  .mwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .dp{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh) + 16px);margin-top:118px!important}
}
.dp{margin-top:18px;background:var(--surf);border-radius:24px;padding:16px 18px 8px}
.dph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}
.dph h2{font:800 17px/1.2 var(--fd);letter-spacing:-.02em;margin:0;min-width:0}
/* agenda rows */
.ev{display:grid;grid-template-columns:52px 4px minmax(0,1fr) auto;gap:11px;align-items:stretch;padding:11px 0;border-top:1px solid var(--line)}
.ev .tm{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;line-height:1.35;padding-top:1px}
.ev .tm small{display:block;color:var(--mut);font-size:13px;font-weight:600}
.ev .cb{border-radius:3px;background:var(--cc)}
.evb{min-width:0;text-align:left}
.evb .tt{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.ev.dn2 .tt{text-decoration:line-through;color:var(--mut)}
.ev .aside{align-self:center}
.pay{font-size:12.5px;font-weight:800;color:var(--bg);background:var(--ink);border-radius:999px;padding:6px 12px;white-space:nowrap}
.paid{font-size:13px;color:var(--pos);font-weight:800;white-space:nowrap}
.lh{font:800 16px/1.2 var(--fd);letter-spacing:-.01em;margin:24px 0 6px}
.lh.t{color:var(--link)}
/* week strip */
.ws{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;max-width:640px}
.ws button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.ws small{font:700 11px var(--fd);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.ws .dn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 17px/1 var(--fd);font-variant-numeric:tabular-nums}
.ws .t .dn{background:var(--acc);color:var(--onacc)}
.ws .s .dn{box-shadow:inset 0 0 0 2px var(--ink)}
.ws .s.t .dn{box-shadow:inset 0 0 0 2px var(--ink)}
.dtitle{font:800 clamp(24px,3.4vw,36px)/1 var(--fd);letter-spacing:-.04em;margin:16px 0 8px}
/* timeline */
.tl{--n:1;margin-top:4px}
.tlh,.adr,.tlg{display:grid;grid-template-columns:52px repeat(var(--n),minmax(0,1fr))}
.tlh{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh));background:var(--bg);z-index:4;border-bottom:1px solid var(--line)}
.tlh button{display:flex;gap:6px;justify-content:center;align-items:center;padding:8px 2px;font:700 11px var(--fd);text-transform:uppercase;letter-spacing:.07em;color:var(--mut);min-width:0}
.tlh b{font:600 17px/1 var(--fd);color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.tlh .t b{background:var(--acc);color:var(--onacc);border-radius:50%;width:32px;height:32px;display:inline-grid;place-items:center}
.adr{border-bottom:1px solid var(--line);padding:6px 0}
.adr.stk1{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh));z-index:4;background:var(--bg)}
.adl{font:700 10px var(--fd);text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:right;padding:6px 8px 0 0}
.adc{display:flex;flex-direction:column;gap:3px;padding:0 2px;min-width:0}
.adchip{font-size:12.5px;font-weight:700;background:var(--cc);color:var(--oc);border-radius:8px;padding:4px 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adchip.dn2{text-decoration:line-through;opacity:.55}
.tlg{position:relative;margin-top:10px}
.hrs{position:relative;height:calc(24 * var(--hh))}
.hrs span{position:absolute;right:9px;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.hrs .nowl{color:var(--bg);background:var(--danger);border-radius:6px;padding:2px 4px;z-index:1;right:4px}
.col{position:relative;height:calc(24 * var(--hh));border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--hh));cursor:copy;min-width:0}
.blk{position:absolute;border-radius:10px;padding:5px 8px;overflow:hidden;font-size:12px;line-height:1.25;background:var(--cc);color:var(--oc);text-align:left;cursor:pointer;z-index:1;box-shadow:0 0 0 1.5px var(--bg)}
.blk b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;opacity:.85}
.blk.tsk{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--cc)}
.blk.dn2 b{text-decoration:line-through}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
@media(min-width:900px){:root{--hh:50px}}
/* year */
.yg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.yg{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.yg{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.ym{display:block;text-align:left;min-width:0;background:var(--surf);border-radius:20px;padding:14px 14px 12px}
.ym h3{margin:0 0 8px;font:800 16px/1.1 var(--fd);letter-spacing:-.02em}
.ym.cur{background:var(--ink);color:var(--bg)}
.ymg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:10px;font-weight:600;text-align:center;gap:3px 0;font-variant-numeric:tabular-nums}
.ymg span{display:grid;place-items:center;height:17px}
.ymg .t{background:var(--acc);color:var(--onacc);border-radius:50%;font-weight:800;width:19px;height:19px;justify-self:center}
@media(min-width:700px){.ymg{font-size:11px}.ymg span{height:19px}.ymg .t{width:21px;height:21px}}
/* tasks */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--cc);color:var(--oc);border-radius:24px;padding:16px;min-height:150px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;text-align:left;gap:6px}
.tile .ci{grid-column:2;grid-row:1;width:46px;height:46px;border-radius:50%;background:var(--oc);color:var(--cc);display:grid;place-items:center}
.tile .ci .i{width:20px;height:20px}
.tile .nm{grid-column:1;grid-row:1;font:800 15px/1.15 var(--fd);letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.tile .cnt{grid-column:1;grid-row:3;font:800 48px/.9 var(--fd);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.lci{width:34px;height:34px;border-radius:50%;background:var(--cc);color:var(--oc);display:grid;place-items:center;flex:none}
.lci .i{width:17px;height:17px}
.trw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:13px 18px;align-items:start;position:relative}
.tc{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);flex:none;margin-top:0;display:grid;place-items:center}
.tc.on{border-color:var(--cc);background:var(--cc)}
.tc.on::after{content:"";width:9px;height:5px;border:2.4px solid var(--oc);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.trb{min-width:0;text-align:left}
.trw.dn2 .tt1{color:var(--mut);text-decoration:line-through}
.fl{color:var(--c-red)}
.fl .i{width:18px;height:18px;fill:currentColor}
.qah{display:flex;flex-wrap:wrap;gap:5px;margin:8px 4px 0}
.qah span{font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 10px}
.ltitle::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--cc);margin-right:.14em;vertical-align:.08em}
/* goals */
.ggrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1150px){.ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gc{container-type:inline-size;background:var(--cc);color:var(--oc);border-radius:26px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:start;min-height:220px}
.gc .ring{grid-column:2;grid-row:1}
.gc .gb{grid-column:1;grid-row:1;text-align:left;min-width:0}
.gc .gt{display:block;font:800 clamp(19px,7.5cqi,28px)/1.05 var(--fd);letter-spacing:-.035em;overflow-wrap:anywhere;margin-bottom:8px}
.gc .ss{color:var(--oc);opacity:.75;font-weight:600}
.gc .late{color:var(--oc);text-decoration:underline}
.gc .ga{grid-column:1/-1;align-self:end;display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1.5px solid color-mix(in srgb,var(--oc) 22%,transparent);padding-top:12px;min-width:0}

function occurs(e,ds){if(!e.d||ds<e.d)return false;if(e.until&&ds>e.until)return false;if(e.ex&&e.ex.includes(ds))return false;
  switch(e.rep){case 'd':return true;case 'wd':{const w=dow(ds);return w>0&&w<6}case 'w':return dow(ds)===dow(e.d);case '2w':return dd(e.d,ds)%14===0;
    case 'm':return +ds.slice(8)===Math.min(+e.d.slice(8),lastDay(ym(ds)));case 'y':return ds.slice(5)===e.d.slice(5);default:return ds===e.d}}
function step(d,rep){const x=D(d);
  if(rep==='d')x.setDate(x.getDate()+1);else if(rep==='w')x.setDate(x.getDate()+7);else if(rep==='2w')x.setDate(x.getDate()+14);
  else if(rep==='m'||rep==='y'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+(rep==='m'?1:12));x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  else{do{x.setDate(x.getDate()+1)}while(x.getDay()===0||x.getDay()===6)}
  return iso(x)}
function nextRep(d,rep){let n=step(d,rep),g=0;while(n<=TODAY()&&g++<900)n=step(n,rep);return n}
const paid=(b,m)=>(b.paid||[]).includes(m);
const pct=g=>{if(g.done)return 100;if(g.kind==='num')return g.target>0?Math.max(0,Math.min(100,Math.round(num(g.cur)/num(g.target)*100))):0;return g.steps.length?Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100):0};
const achieved=g=>g.done||pct(g)>=100;
function evEnd(e){const s=toMin(e.s);let en=toMin(e.e);if(e.e==='00:00')en=1440;if(en<=s)en=Math.min(1440,s+60);return en}
function dayItems(ds){const L=[];
  S.events.forEach(e=>{const c=calOf(e.cal);if(!c||c.on===false||!occurs(e,ds))return;
    L.push({k:'ev',id:e.id,t:e.t||'Новое событие',ad:!!e.allDay,s:e.allDay?null:toMin(e.s),e:e.allDay?null:evEnd(e),c:c.c,sub:[e.loc,c.n].filter(Boolean).join(' · '),o:e})});

  if(S.showBills){const m=ym(ds),day=+ds.slice(8);S.bills.forEach(b=>{if(Math.min(b.day,lastDay(m))!==day)return;L.push({k:'bill',id:b.id,t:b.n,ad:true,c:catC(b.c),sub:'Платёж · '+rub(b.a),o:b,m,done:paid(b,m)})})}

const WDN={'пн':1,'понедельник':1,'вт':2,'вторник':2,'ср':3,'среду':3,'среда':3,'чт':4,'четверг':4,'пт':5,'пятницу':5,'пятница':5,'сб':6,'субботу':6,'суббота':6,'вс':0,'воскресенье':0};
function parse(raw,defD){let s=' '+raw+' ';const o={d:defD,tm:'',flag:false,list:'',rep:'',_d:false};
  const take=(re,fn)=>{s=s.replace(re,(...m)=>{fn(m);return ' '})};
  take(/\s(каждый день|ежедневно)(?=\s)/i,()=>o.rep='d');take(/\s(по будням)(?=\s)/i,()=>o.rep='wd');
  take(/\s(каждую неделю|еженедельно)(?=\s)/i,()=>o.rep='w');take(/\s(каждый месяц|ежемесячно)(?=\s)/i,()=>o.rep='m');
  take(/\sпослезавтра(?=\s)/i,()=>{o.d=addDays(TODAY(),2);o._d=true});take(/\sзавтра(?=\s)/i,()=>{o.d=addDays(TODAY(),1);o._d=true});take(/\sсегодня(?=\s)/i,()=>{o.d=TODAY();o._d=true});
  take(/\s(?:во?\s)?(понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье|пн|вт|ср|чт|пт|сб|вс)(?=\s)/i,m=>{const w=WDN[m[1].toLowerCase()];let d=addDays(TODAY(),1);while(dow(d)!==w)d=addDays(d,1);o.d=d;o._d=true});
  take(/\s(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?=\s)/,m=>{const a=+m[1],b=+m[2];if(a<1||a>31||b<1||b>12)return;const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):new Date().getFullYear();let c=y+'-'+pad(b)+'-'+pad(a);if(!m[3]&&c<TODAY())c=(y+1)+c.slice(4);o.d=c;o._d=true});
  take(/\s(?:в\s)?(\d{1,2}):(\d{2})(?=\s)/,m=>{if(+m[1]<24&&+m[2]<60)o.tm=pad(+m[1])+':'+m[2]});
  take(/\s!{1,3}[123]?(?=\s)/,()=>o.flag=true);take(/\s#([^\s#!]+)/,m=>o.list=m[1]);
  if((o.rep||o.tm)&&!o.d)o.d=TODAY();o.t=s.replace(/\s+/g,' ').trim();return o}

function gate(){
  const feats=[['teal','cal','Календарь','День, неделя, месяц и год. Повторы и напоминания.'],['purple','tasks','Задачи','Списки и сроки. Пишите обычным текстом: «завтра 10:00».'],['red','goals','Цели','Шаги или числа, прогресс и сроки в календаре.'],['brown','fin','Финансы','Бюджет, категории и регулярные платежи.']];

function nameFields(){const old=legacyData;
  return '<h2 class="gh">Как вас зовут</h2>'+sec('<div class="row"><input id="r-name" class="ri" value="'+esc(S.name||regName)+'" placeholder="Имя" autocomplete="given-name" aria-label="Имя"></div>')
   +(old?'<label class="check" style="margin:14px 4px 0"><input type="checkbox" id="r-mig" checked> Перенести данные из прошлой версии Life OS ('+plural((old.tasks||[]).length,'задача','задачи','задач')+', '+plural((old.exp||[]).length,'операция','операции','операций')+')</label>'
     :legacyPlanner?'<p class="gf" style="margin:12px 4px 0">Записи, уже сохранённые в этом браузере, перенесутся в новый аккаунт.</p>':'')}
const goBtn=l=>'<p class="serr" id="rerr" role="alert" style="margin:14px 4px 0"></p><button class="btn" style="margin-top:18px" data-a="gatego">'+l+'</button>';
function gateForm(){
  const msg=authMsg?'<div class="okmsg" role="status">'+esc(authMsg)+'</div>':'';
  const email='<div class="row"><input id="r-email" class="ri" type="email" autocomplete="email" inputmode="email" placeholder="Электронная почта" aria-label="Электронная почта" value="'+esc(acctEmail)+'"></div>';
  const pass=(ac,ph,id)=>'<div class="row"><input id="'+(id||'r-pass')+'" class="ri" type="password" autocomplete="'+ac+'" placeholder="'+ph+'" aria-label="'+ph+'"></div>';
  const pass2=pass('new-password','Пароль, не короче 6 символов')+pass('new-password','Повторите пароль','r-pass2');
  const note=mode==='sb'?'':'<p class="gf" style="text-align:center;margin-top:14px">'+(mode==='cloud'?'Данные хранятся в вашем аккаунте и видны только вам.':'Аккаунт и данные хранятся в этом браузере.')+'</p>';
  const back='<p style="text-align:center;margin-top:12px"><button class="tb sm" data-a="atab" data-id="login">Вспомнили пароль? Войти</button></p>';
  if(authTab==='profile')return msg+'<p class="gf" style="margin:0 4px 6px">Почта подтверждена. Осталось представиться.</p>'+nameFields()+goBtn('Начать');
  if(authTab==='newpass')return '<h2 class="gh" style="margin-top:0">Новый пароль</h2>'+sec(pass2)+goBtn('Сохранить пароль');
  if(authTab==='setpass')return '<h2 class="gh" style="margin-top:0">Защитите аккаунт</h2><p class="gf" style="margin:0 4px 14px">Теперь вход в Life OS по почте и паролю. Все ваши записи сохранятся.</p>'+sec(email+pass2)+nameFields()+goBtn('Сохранить и войти');
  const seg='<div class="seg" role="tablist" style="margin-bottom:18px">'+[['signup','Регистрация'],['login','Вход']].map(([k,l])=>'<button role="tab" class="'+(authTab===k?'on':'')+'" aria-selected="'+(authTab===k)+'" data-a="atab" data-id="'+k+'">'+l+'</button>').join('')+'</div>';
  if(authTab==='reset'){
    if(mode==='sb')return seg+'<h2 class="gh" style="margin-top:0">Восстановление пароля</h2>'+sec(email)+'<p class="gf">Пришлём письмо со ссылкой для нового пароля.</p>'+goBtn('Отправить ссылку')+back;
    if(mode==='cloud')return seg+'<h2 class="gh" style="margin-top:0">Новый пароль</h2><p class="gf" style="margin:0 4px 14px">Вы уже вошли в Claude под своим аккаунтом, поэтому письмо не нужно. Просто придумайте новый пароль.</p>'+sec(pass2)+goBtn('Сохранить пароль')+back;
    return seg+'<h2 class="gh" style="margin-top:0">Восстановление пароля</h2><p class="gf" style="margin:0 4px 14px">Без сервера пароль хранится только в этом браузере, поэтому восстановить его нельзя. Создайте новый аккаунт на другую почту.</p>'+back}
  if(authTab==='login')return seg+msg+sec(email+pass('current-password','Пароль'))+goBtn('Войти')+'<p style="text-align:center;margin-top:12px"><button class="tb sm" data-a="atab" data-id="reset">Забыли пароль?</button></p>'+note;
  return seg+msg+sec(email+pass2)+nameFields()+goBtn('Создать аккаунт')+note}
const SBERR={'Invalid login credentials':'Неверная почта или пароль','User already registered':'Этот адрес уже зарегистрирован. Откройте вкладку «Вход»','Email not confirmed':'Почта ещё не подтверждена. Откройте письмо и нажмите ссылку','Unable to validate email address: invalid format':'Проверьте адрес почты'};
const sbErr=e=>{const m=(e&&e.message)||String(e||'');if(SBERR[m])return SBERR[m];if(/rate limit|too many/i.test(m))return 'Слишком много попыток. Подождите минуту';if(/fetch|network/i.test(m))return 'Нет связи с сервером. Проверьте интернет';if(/password/i.test(m))return 'Пароль должен быть не короче 6 символов';return m||'Что-то пошло не так. Попробуйте ещё раз'};
function rbad(id,msg){const e=$id('rerr'),el=id&&$id(id);if(e)e.textContent=msg;if(el)el.focus()}
let busy=false;
async function gateGo(){if(busy)return;busy=true;const b=document.querySelector('[data-a="gatego"]');if(b)b.disabled=true;
  try{await gateStep()}catch(e){rbad('',sbErr(e))}finally{busy=false;const b2=document.querySelector('[data-a="gatego"]');if(b2)b2.disabled=false}}
async function gateStep(){
  if(mode!=='sb'){const email=normEmail(fv('r-email')),pass=fv('r-pass'),pass2=fv('r-pass2');
    if(authTab==='login'){if(!okEmail(email))return rbad('r-email','Проверьте адрес почты');if(!pass)return rbad('r-pass','Введите пароль');
      if(mode==='cloud'){const a=cloudData&&cloudData.auth;if(!a)return rbad('r-email','Аккаунт не найден. Откройте вкладку «Регистрация»');
        if(normEmail(a.email)!==email||await hashPw(pass,a.salt)!==a.hash)return rbad('r-pass','Неверная почта или пароль');LS.set(CLOK,a.hash.slice(0,24));S=cloudData}
      else{const a=accounts()[email];if(!a)return rbad('r-email','Аккаунт с такой почтой не найден');if(await hashPw(pass,a.salt)!==a.hash)return rbad('r-pass','Неверный пароль');
        acctId=a.id;acctEmail=email;LS.set(SESK,a.id);S=migrate(readJSON(LSK+':'+a.id,{}))}
      phase='app';tab='home';authMsg='';render();scrollTo(0,0);toast('С возвращением'+(S.name?', '+S.name:''));return}
    if(authTab==='reset'||authTab==='newpass'){if(mode!=='cloud'||!cloudData)return;
      if(pass.length<6)return rbad('r-pass','Пароль должен быть не короче 6 символов');if(pass!==pass2)return rbad('r-pass2','Пароли не совпадают');
      const salt=newSalt();cloudData.auth=Object.assign({},cloudData.auth,{salt,hash:await hashPw(pass,salt)});S=cloudData;LS.set(CLOK,S.auth.hash.slice(0,24));phase='app';tab='home';save();toast('Пароль изменён');return}
    const name=fv('r-name').trim();
    if(!okEmail(email))return rbad('r-email','Проверьте адрес почты');if(pass.length<6)return rbad('r-pass','Пароль должен быть не короче 6 символов');if(pass!==pass2)return rbad('r-pass2','Пароли не совпадают');if(!name)return rbad('r-name','Как вас зовут?');
    if(mode==='local'&&accounts()[email])return rbad('r-email','Этот адрес уже зарегистрирован. Откройте вкладку «Вход»');
    if(mode==='cloud'&&authTab==='signup'&&cloudData&&cloudData.auth)return rbad('r-email','У вас уже есть аккаунт. Откройте вкладку «Вход»');
    const salt=newSalt(),hash=await hashPw(pass,salt),mig=$id('r-mig');
    const base=authTab==='setpass'&&cloudData?cloudData:(mig&&mig.checked&&legacyData?fromLifeOS(legacyData):legacyPlanner||def());
    if(mode==='cloud'){S=migrate(Object.assign({},base,{name,created:base.created||TODAY(),auth:{email,salt,hash}}));cloudData=S;LS.set(CLOK,hash.slice(0,24))}
    else{const id=uid(),ac=accounts();ac[email]={id,salt,hash};LS.set(ACCK,JSON.stringify(ac));LS.set(SESK,id);acctId=id;acctEmail=email;S=migrate(Object.assign({},base,{name,created:base.created||TODAY()}));if(legacyPlanner){LS.del(LSK);legacyPlanner=null}}
    phase='app';tab='home';save();toast(authTab==='setpass'?'Готово. Теперь вход по почте и паролю':'Аккаунт создан. Добро пожаловать, '+name);return}
  if(mode==='sb'&&authTab==='login'){const email=fv('r-email').trim(),pass=fv('r-pass');if(!email)return rbad('r-email','Введите почту');if(!pass)return rbad('r-pass','Введите пароль');
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error)return rbad('r-pass',sbErr(error));
    sbUser=data.user;authMsg='';await sbLoad();scrollTL=true;render();if(phase==='app')toast('С возвращением'+(S.name?', '+S.name:''));return}
  if(mode==='sb'&&authTab==='reset'){const email=fv('r-email').trim();if(!email)return rbad('r-email','Введите почту');
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return rbad('r-email',sbErr(error));
    authTab='login';authMsg='Письмо со ссылкой отправлено на '+email+'.';render();return}
  if(mode==='sb'&&authTab==='newpass'){const pass=fv('r-pass');if(pass.length<6)return rbad('r-pass','Пароль должен быть не короче 6 символов');
    const {error}=await sb.auth.updateUser({password:pass});if(error)return rbad('r-pass',sbErr(error));
    recovering=false;history.replaceState(null,'',location.pathname);const {data:{user}}=await sb.auth.getUser();sbUser=user;await sbLoad();render();if(phase==='app')toast('Пароль изменён');return}
  const name=fv('r-name').trim();if(!name)return rbad('r-name','Как вас зовут?');
  const mig=$id('r-mig');const base=mig&&mig.checked&&legacyData?fromLifeOS(legacyData):def();
  if(mode==='sb'&&authTab==='signup'){const email=fv('r-email').trim(),pass=fv('r-pass');
    if(!/^\S+@\S+\.\S+$/.test(email))return rbad('r-email','Проверьте адрес почты');if(pass.length<6)return rbad('r-pass','Пароль должен быть не короче 6 символов');
    const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return rbad('r-email',sbErr(error));
    if(!data.session){LS.set('lifeos-pending',JSON.stringify(Object.assign({},base,{name})));authTab='login';authMsg='Почти готово. Мы отправили письмо на '+email+'. Подтвердите почту и войдите.';render();return}
    sbUser=data.user}
  S=migrate(Object.assign({},base,{name,created:TODAY()}));gateImport=null;phase='app';tab='home';save();toast('Добро пожаловать, '+name)}
async function logout(){clearTimeout(timer);const data=JSON.parse(JSON.stringify(S));
  if(mode==='sb'){try{await sb.from('planner').upsert({user_id:sbUser.id,data})}catch(_){}await sb.auth.signOut();sbUser=null}
  else if(mode==='cloud'){try{await ref.set(data)}catch(_){}LS.del(CLOK);cloudData=migrate(data)}
  else{if(acctId)LS.set(LSK+':'+acctId,JSON.stringify(data));LS.del(SESK);acctId=null}

let wtRange=90;
const niceStep=r=>{const p=Math.pow(10,Math.floor(Math.log10(r||1))),n=r/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p};
function wChart(){let w=[...S.wt].sort((a,b)=>a.d.localeCompare(b.d));if(wtRange)w=w.filter(x=>x.d>=addDays(TODAY(),-wtRange));
  if(w.length<2)return '<div class="cempty">'+(S.wt.length?'Для графика нужно хотя бы два замера за выбранный период.':'Добавьте первый замер веса, и здесь появится график.')+'</div>';
  const W=640,H=240,L=46,R=18,T=18,B=30,goal=num(S.wtGoal)||null;
  let lo=Math.min(...w.map(x=>x.v),goal||Infinity),hi=Math.max(...w.map(x=>x.v),goal||-Infinity);const pv=Math.max(.5,(hi-lo)*.12);lo-=pv;hi+=pv;
  const st=niceStep((hi-lo)/4);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const t0=D(w[0].d).getTime(),sp=Math.max(1,D(w[w.length-1].d).getTime()-t0);
  const X=d=>L+(D(d).getTime()-t0)/sp*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[];for(let v=lo;v<=hi+1e-9;v+=st)ticks.push(Math.round(v*100)/100);
  const pts=w.map(x=>X(x.d).toFixed(1)+','+Y(x.v).toFixed(1)),last=w[w.length-1];
  const area='M'+pts[0]+' L'+pts.join(' L')+' L'+X(last.d).toFixed(1)+','+(H-B)+' L'+X(w[0].d).toFixed(1)+','+(H-B)+'Z';
  return '<svg class="wchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Вес с '+dLong(w[0].d)+' по '+dLong(last.d)+': от '+fmt1(Math.min(...w.map(x=>x.v)))+' до '+fmt1(Math.max(...w.map(x=>x.v)))+' кг">'
   +ticks.map(v=>'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+fmt1(v)+'</text>').join('')
   +(goal?'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(goal).toFixed(1)+'" y2="'+Y(goal).toFixed(1)+'" stroke="var(--c-green)" stroke-width="2" stroke-dasharray="6 5"/><text x="'+(W-R)+'" y="'+(Y(goal)-7).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--c-green)">цель '+fmt1(goal)+' кг</text>':'')
   +'<path d="'+area+'" fill="var(--link)" opacity=".12"/>'
   +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--link)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
   +w.map(x=>'<circle cx="'+X(x.d).toFixed(1)+'" cy="'+Y(x.v).toFixed(1)+'" r="3.5" fill="var(--surf)" stroke="var(--link)" stroke-width="2"><title>'+dLong(x.d)+': '+fmt1(x.v)+' кг</title></circle>').join('')
   +'<circle cx="'+X(last.d).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="6.5" fill="var(--link)"/>'
   +'<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="var(--mut)">'+dLong(w[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+dLong(last.d)+'</text></svg>'}
function wStats(){const w=[...S.wt].sort((a,b)=>a.d.localeCompare(b.d)),last=w[w.length-1];if(!last)return '';
  const from=wtRange?addDays(TODAY(),-wtRange):'',base=w.find(x=>!from||x.d>=from)||w[0],diff=last.v-base.v,goal=num(S.wtGoal);
  return '<div class="sstats"><div><b>'+fmt1(last.v)+'</b><span>кг сейчас</span></div><div><b>'+(diff>0?'+':diff<0?'−':'')+fmt1(Math.abs(diff))+'</b><span>кг за период</span></div><div><b>'+(goal?fmt1(Math.abs(last.v-goal)):'—')+'</b><span>'+(goal?'кг до цели':'цель не задана')+'</span></div></div>'}
function sportV(){const ww=wkWeek(),wmin=ww.reduce((a,x)=>a+num(x.min),0),wkc=ww.reduce((a,x)=>a+num(x.kcal),0),ws=wkStart(TODAY()),td=TODAY();

   +'<section class="scard w2"><div class="sh"><h2>Тренировки</h2><button class="tb sm" data-a="new" data-k="wk">+ Добавить</button></div>'+(hist.length?hist.map(wkRow).join(''):empty('Пока нет тренировок. Выберите вид тренировки слева, чтобы записать первую.'))+'</section>'
   +'</div></div>'}

/* ---------- timer ---------- */
const TM={mode:'cd',run:false,t0:0,acc:0,laps:[],len:300,end:0,left:300,iv:{work:40,rest:20,rounds:8},ph:'work',rd:1};
let tmI=null,tmAC=null;
function tmBeep(n){try{tmAC=tmAC||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=tmAC.createOscillator(),g=tmAC.createGain(),t=tmAC.currentTime+i*.28;o.frequency.value=i%2?660:990;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g).connect(tmAC.destination);o.start(t);o.stop(t+.25)}}catch(_){}}
const tmF=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):pad(m))+':'+pad(x)};
function tmVal(){if(TM.mode==='sw'){const ms=TM.acc+(TM.run?Date.now()-TM.t0:0);return tmF(ms/1000)+'<small>,'+Math.floor(ms%1000/100)+'</small>'}
  return tmF(TM.run?Math.ceil((TM.end-Date.now())/1000):TM.left)}
function tmSub(){if(TM.mode==='iv')return (TM.ph==='work'?'Работа':'Отдых')+' · раунд '+TM.rd+' из '+TM.iv.rounds;
  if(TM.mode==='cd')return 'Обратный отсчёт · '+(TM.len%60?tmF(TM.len):durTxt(TM.len/60));return TM.laps.length?'Кругов: '+TM.laps.length:'Секундомер'}
function timerBlock(){
  const seg='<div class="seg">'+[['sw','Секундомер'],['cd','Таймер'],['iv','Интервалы']].map(([k,l])=>'<button class="'+(TM.mode===k?'on':'')+'" data-a="tmode" data-v="'+k+'">'+l+'</button>').join('')+'</div>';
  const pre=TM.mode==='cd'?'<div class="chips">'+[1,3,5,10,15,30].map(m=>'<button class="chip'+(TM.len===m*60?' on':'')+'" data-a="tpre" data-v="'+m+'">'+m+' мин</button>').join('')+'<button class="chip" data-a="tcus">Своё</button></div>'
    :TM.mode==='iv'?'<div class="chips"><button class="chip on" data-a="ivset">'+TM.iv.work+' с работа · '+TM.iv.rest+' с отдых · '+TM.iv.rounds+' раундов</button></div>':'';
  let laps='';if(TM.mode==='sw'&&TM.laps.length)laps='<div class="laps">'+TM.laps.map((l,i)=>({l,i})).reverse().slice(0,5).map(x=>'<span>Круг '+(x.i+1)+'<b>'+tmF(x.l/1000)+','+Math.floor(x.l%1000/100)+'</b></span>').join('')+'</div>';
  return '<div class="sh"><h2>Таймер</h2></div>'+seg+'<div class="tdig" id="tdig">'+tmVal()+'</div><div class="tsub" id="tsub">'+tmSub()+'</div>'+pre+laps
   +'<div class="acts"><button class="bbtn" data-a="tgo">'+(TM.run?'Пауза':'Старт')+'</button><button class="bbtn ghost" data-a="treset">Сброс</button>'+(TM.mode==='sw'&&TM.run?'<button class="bbtn ghost" data-a="tlap">Круг</button>':'')+(TM.mode==='sw'&&!TM.run&&TM.acc>=60000?'<button class="bbtn ghost" data-a="tsave">Записать тренировку</button>':'')+'</div>'}
function tmTick(){if(!TM.run)return;
  if(TM.mode!=='sw'&&Date.now()>=TM.end){
    if(TM.mode==='cd'){TM.run=false;TM.left=0;clearInterval(tmI);tmBeep(4);notify('Таймер','Время вышло');render();return}
    if(TM.ph==='work'&&TM.iv.rest>0){TM.ph='rest';TM.end=Date.now()+TM.iv.rest*1000;tmBeep(1)}
    else if(TM.rd<TM.iv.rounds){TM.rd++;TM.ph='work';TM.end=Date.now()+TM.iv.work*1000;tmBeep(2)}
    else{TM.run=false;clearInterval(tmI);tmBeep(4);notify('Интервалы','Тренировка завершена: '+TM.iv.rounds+' раундов');TM.ph='work';TM.rd=1;TM.left=TM.iv.work;render();return}
    const s=$id('tsub');if(s)s.textContent=tmSub()}
  const d=$id('tdig');if(d)d.innerHTML=tmVal()}
function tmGo(){try{tmAC=tmAC||new (window.AudioContext||window.webkitAudioContext)();tmAC.resume()}catch(_){}
  if(TM.run){if(TM.mode==='sw')TM.acc+=Date.now()-TM.t0;else TM.left=Math.max(0,Math.ceil((TM.end-Date.now())/1000));TM.run=false;clearInterval(tmI)}
  else{if(TM.mode==='sw')TM.t0=Date.now();else{if(TM.left<=0)TM.left=TM.mode==='cd'?TM.len:TM.iv.work;TM.end=Date.now()+TM.left*1000}TM.run=true;clearInterval(tmI);tmI=setInterval(tmTick,100)}
  render()}
function tmReset(){TM.run=false;clearInterval(tmI);TM.acc=0;TM.laps=[];TM.left=TM.mode==='cd'?TM.len:TM.iv.work;TM.ph='work';TM.rd=1;render()}

  const P=Array.from({length:170},()=>({x:W/2+(Math.random()-.5)*160,y:H*.38,vx:(Math.random()-.5)*16,vy:-Math.random()*15-5,r:Math.random()*7+5,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.35,round:Math.random()<.45}));
  const t0=performance.now();(function f(t){const el=t-t0;x.clearRect(0,0,W,H);x.globalAlpha=Math.max(0,1-el/2800);
    P.forEach(p=>{p.vy+=.38;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;if(p.round){x.beginPath();x.arc(0,0,p.r/2,0,7);x.fill()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});

/* ---------- reminders ---------- */
const fired=new Set();
async function askNotif(silent){try{if(!('Notification' in window))throw 0;if(Notification.permission==='default'){const r=await Notification.requestPermission();if(!silent)toast(r==='granted'?'Уведомления включены':'Браузер не разрешил уведомления. Напоминания будут всплывать на странице');render()}else if(!silent)toast(Notification.permission==='granted'?'Уведомления уже включены':'Уведомления запрещены в настройках браузера для этого сайта')}catch(_){if(!silent)toast('Здесь уведомления браузера недоступны. Напоминания будут всплывать на странице, пока она открыта')}}
function notify(title,body){const b=$id('banner');b.innerHTML=appIcon()+'<div><b>'+esc(title)+'</b><span>'+esc(body)+'</span></div>';b.hidden=false;clearTimeout(b._t);b._t=setTimeout(()=>{b.hidden=true},9000);
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body})}catch(_){}
  try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.4);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.4)}catch(_){}}
function checkAlerts(){if(phase!=='app')return;const td=TODAY(),nm=nowMin();
  [[td,0],[addDays(td,1),1440]].forEach(([ds,off])=>S.events.forEach(e=>{if(e.al===''||e.al==null||e.allDay||!occurs(e,ds))return;const at=toMin(e.s)+off-(+e.al),key=e.id+ds;
    if(nm>=at&&nm<at+3&&!fired.has(key)){fired.add(key);notify(e.t||'Событие',(+e.al?ALERT[e.al].replace('За','Через')+' · ':'Начинается сейчас · ')+(off?'завтра в ':'в ')+e.s+(e.loc?' · '+e.loc:''))}}));
  S.tasks.forEach(t=>{if(t.done||t.d!==td||!t.tm)return;const at=toMin(t.tm),key=t.id+td+t.tm;if(nm>=at&&nm<at+3&&!fired.has(key)){fired.add(key);notify(t.t,'Задача на '+t.tm)}})}

/* ---------- export / import ---------- */
async function exportData(){const fname='life-os-'+TODAY()+'.json',data=JSON.stringify(S,null,2);
  try{if(window.claude&&window.claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:fname,data});return}}
    const url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
  catch(_){toast('Скачивание недоступно в этом окне')}}
function importFile(f){const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0}catch(_){toast('Не удалось прочитать файл. Нужна копия Life OS в формате JSON');return}
  const n=isLifeOS(d)?fromLifeOS(d):migrate(d);
  if(phase!=='app'){gateImport=n;if(n.name&&!S.name)regName=n.name;render();return}
  const before=JSON.stringify(S);S=migrate(Object.assign(n,{name:S.name||n.name,created:S.created||TODAY()}));save();toast('Данные загружены',()=>{S=migrate(JSON.parse(before));save()})};r.readAsText(f)}

document.addEventListener('keydown',e=>{const t=e.target,typing=t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if(SH){if(e.key==='Escape'){const bk=SH.opt&&SH.opt.backSH;closeSheet();if(bk){SH=bk;drawSheet()}return}
    if(e.key==='Enter'&&t.tagName==='INPUT'&&t.type!=='checkbox'){e.preventDefault();if(t.id==='f-step'){collect();drawSheet(false,'f-step')}else if(t.id!=='f-q')saveSheet()}return}
  if(phase==='gate'){if(e.key==='Enter'&&t.tagName==='INPUT'&&t.type!=='checkbox'){e.preventDefault();gateGo()}return}
  if(phase!=='app')return;
  if((e.key==='Enter'||e.key===' ')&&t.dataset&&t.dataset.a==='hcard'){e.preventDefault();openHC(t.dataset.id);return}
  if(t.id==='qa'&&e.key==='Enter'){e.preventDefault();quickAdd();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
